<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Allura&family=EB+Garamond:ital@0;1&family=Karla:wght@300;400&display=swap" rel="stylesheet">
<style>
body { margin:0; width:1200px; height:630px; overflow:hidden; background:#221511; }
.cover { width:1200px; height:630px; position:relative;
  background:
    radial-gradient(90% 70% at 50% 108%, rgba(233, 197, 190, .22) 0%, transparent 58%),
    radial-gradient(120% 100% at 50% -10%, #3a2a25 0%, #2a1a15 52%, #221511 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.glow { position:absolute; top:110px; left:50%; transform:translateX(-50%);
  width:540px; height:540px; border-radius:50%;
  background:radial-gradient(circle, rgba(242, 222, 208, .10) 0%, rgba(194, 164, 104, .05) 46%, transparent 70%); }
.spray { position:absolute; opacity:.92; }
.sl { left:-46px; bottom:-58px; width:330px; }
.sr { right:-46px; top:-64px; width:330px; transform:scaleX(-1) rotate(4deg); }
.wreath { position:relative; width:226px; height:226px; }
.init { position:absolute; inset:0; display:grid; place-items:center;
  font-family:'Allura',cursive; font-size:50px; color:#eedcae; text-shadow:0 2px 14px rgba(26,14,10,.4); }
.wreath::before { content:''; position:absolute; left:50%; top:50%; width:150px; height:150px;
  transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(34,21,17,.72) 0%, rgba(34,21,17,.38) 62%, transparent 82%); }
.names { font-family:'Italiana',serif; font-size:64px; letter-spacing:.05em; color:#f8f2e6; margin-top:14px; }
.names .amp { font-family:'Allura',cursive; color:#d9bc7f; font-size:56px; padding:0 16px; }
.line { width:430px; height:1px; margin:20px 0 18px;
  background:linear-gradient(90deg, transparent, rgba(217,188,127,.65), transparent); position:relative; }
.line i { position:absolute; left:50%; top:-3.5px; width:8px; height:8px; transform:translateX(-50%) rotate(45deg);
  border:1px solid rgba(217,188,127,.8); background:#2a1a15; }
.date { font-family:'Karla',sans-serif; font-weight:300; font-size:19px; letter-spacing:.44em; text-transform:uppercase; color:#c4ab7e; }
.sub { margin-top:13px; font-family:'EB Garamond',serif; font-style:italic; font-size:20px; color:#d3b3a4; }
.wordmark { position:absolute; bottom:26px; left:0; right:0; font-family:'Karla',sans-serif;
  font-size:12px; letter-spacing:.5em; color:rgba(217,188,127,.55); text-transform:uppercase; }
</style></head><body><div class="cover">
  <div class="glow"></div>
  <img class="spray sl" src="assets/art/wed-rose-corner.webp" alt="">
  <img class="spray sr" src="assets/art/wed-rose-corner.webp" alt="">
  <div class="wreath">
    <img src="assets/art/wed-wreath-wed.webp" style="width:226px;height:226px;object-fit:contain" alt="">
    <div class="init">W · T</div>
  </div>
  <div class="names">Wren<span class="amp">&amp;</span>Theodore</div>
  <div class="line"><i></i></div>
  <div class="date">19 · 06 · 2027</div>
  <div class="sub">roses, candlelight &amp; one perfect evening — you are cordially invited</div>
  <div class="wordmark">Vesperwood · Wedding Invitation</div>
</div></body></html>
